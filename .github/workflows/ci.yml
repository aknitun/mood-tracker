name: CI -- Mood Tracker
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest # TODO: quel runner ?
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci # TODO: installation reproductible
      - run: npm run lint
      - run: npm run format:check
  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: quality # TODO: quel job doit passer avant ?
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: tests # TODO: quel job avant ?
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build